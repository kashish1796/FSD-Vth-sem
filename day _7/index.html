<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .product {
            background: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .product h2 {
            font-size: 20px;
        }

        .mrp {
            font-size: 18px;
            font-weight: bold;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid gray;
        }

        .remove {
            background-color: red;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🛍️ My Shopping Store</h1>

    <!-- PRODUCTS -->
    <div class="products">

        <div class="product">
            <h2>Running Shoes</h2>
            <p class="mrp">MRP: ₹1999</p>

            <button onclick="addToCart('Running Shoes', 1999)">
                Add to Cart
            </button>
        </div>


        <div class="product">
            <h2>Smart Watch</h2>
            <p class="mrp">MRP: ₹2999</p>

            <button onclick="addToCart('Smart Watch', 2999)">
                Add to Cart
            </button>
        </div>


        <div class="product">
            <h2>Headphones</h2>
            <p class="mrp">MRP: ₹1499</p>

            <button onclick="addToCart('Headphones', 1499)">
                Add to Cart
            </button>
        </div>

    </div>


    <!-- CART -->
    <div class="cart">

        <h2>🛒 Cart</h2>

        <div id="cartItems">
            <p>Cart is empty</p>
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

    </div>


    <script>

        let cart = [];


        // Add product to cart
        function addToCart(name, price) {

            let product = cart.find(item => item.name === name);

            if (product) {

                // If already in cart
                product.quantity++;

            } else {

                // Add new product
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });

            }

            displayCart();
        }


        // Display cart
        function displayCart() {

            let cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;


            if (cart.length === 0) {

                cartItems.innerHTML = "<p>Cart is empty</p>";

            }


            cart.forEach((item, index) => {

                total = total + (item.price * item.quantity);

                cartItems.innerHTML += `

                    <div class="cart-item">

                        <div>
                            <b>${item.name}</b>
                            <br>
                            MRP: ₹${item.price}
                        </div>

                        <div>
                            Quantity: ${item.quantity}
                        </div>

                        <button class="remove"
                            onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>

                `;

            });


            document.getElementById("total").innerText = total;

        }


        // Remove product
        function removeItem(index) {

            cart.splice(index, 1);

            displayCart();

        }

    </script>

</body>
</html>
